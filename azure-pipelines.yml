# Builds every push and PR; publishes to npmjs.org when a merge to main bumps the version in package.json,
# after approval in the 'package-release' environment (toolkit release/docs/ADOPTING.md).

trigger:
  branches:
    include: [ main ]

pr:
  branches:
    include: [ main ]

lockBehavior: sequential           # with the environment's exclusive lock: releases never overlap

resources:
  repositories:
    - repository: toolkit
      type: github
      name: typhoon41/toolkit
      endpoint: typhoon41

stages:
  - template: release/templates/stages/package-release.yml@toolkit
    parameters:
      releaseNotes: true
      environment: package-release
      releaseVariableGroup: ''                   # both service connections below replace the secrets
      npmServiceConnection: 'NPM - typhoon41'
      useGitHubServiceConnection: true
      npmAccess: public
      enforceCommitConvention: true
      buildSteps:
        - task: NodeTool@0
          displayName: Install Node
          inputs:
            versionSpec: 22.x
        - pwsh: npm ci
          displayName: Install packages
        - pwsh: npm run lint-check
          displayName: Lint
        - pwsh: npm test
          displayName: Test
        - pwsh: npm run build         # dist/ is packed into the tarball
          displayName: Build
